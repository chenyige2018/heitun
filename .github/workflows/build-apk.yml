name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.5
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.5/bin/gradle
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses and install components
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKM" ]; then SDKM=$(command -v sdkmanager || true); fi
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ] && [ -f "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "no build-tools dir"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            echo "使用仓库 Secret 中的签名文件"
          elif [ -f app/keystore.jks ]; then
            echo "使用仓库中的签名文件"
          else
            keytool -genkeypair -v -keystore app/keystore.jks -alias tunlian \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass tunlian2026 -keypass tunlian2026 \
              -dname "CN=TunLian, OU=App, O=TunLian, L=Beijing, S=Beijing, C=CN"
            echo "首次构建，已自动生成签名文件（请在构建产物中下载保存）"
          fi

      - name: Show SDK contents
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Build release APK
        id: apkbuild
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Report build errors
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            {
              echo "### 编译错误摘要"
              echo '```'
              grep -nE "error:|FAILED|What went wrong|Caused by|Could not|Cannot|failed to" build.log | head -60
              echo '```'
              echo
              echo "### 日志末尾 60 行"
              echo '```'
              tail -60 build.log
              echo '```'
            } > err.md
            cat err.md >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.apkbuild.outcome }}" = "failure" ]; then
              jq -n --arg t "构建失败 $(date +'%Y-%m-%d %H:%M')" --arg b "$(cat err.md)" '{title:$t, body:$b}' > payload.json
              curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues" -d @payload.json > /dev/null
            fi
          fi

      - name: Push build log to branch
        if: always()
        run: |
          if [ -f build.log ]; then
            git config user.name "ci-bot"
            git config user.email "ci@local"
            git checkout -B buildlog
            mkdir -p .ci
            cp build.log .ci/build.log
            git add -f .ci/build.log
            git commit -m "build log $(date +'%Y-%m-%d %H:%M')" || echo "no change"
            git push -f origin buildlog || echo "push failed"
          fi

      - name: Fail job if build failed
        if: steps.apkbuild.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tunlian-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: tunlian-release-keystore
          path: app/keystore.jks
