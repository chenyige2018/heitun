plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tunlian.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tunlian.app"
        minSdk 26
        targetSdk 34
        // 每次出包必须 versionCode +1，否则老版本 APP 检测不到更新
        versionCode 18
        versionName "1.4.3"

        /* 【2026-10-04】原生音视频 SDK 只保留手机主流架构，避免包体被 x86 撑大 */
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    /* 【2026-10-19】双品牌：一次构建同时出「豚链AI」和「贝贝快聊」两个包
     * 包名不同 → 手机上可共存安装、互不覆盖；名称/图标/更新地址各自独立
     * 构建：gradle assembleTunlianRelease assembleBeibeiRelease */
    flavorDimensions "brand"
    productFlavors {
        tunlian {
            dimension "brand"
            applicationId "com.tunlian.app"      // 保持原包名，老用户可无缝覆盖升级
        }
        beibei {
            dimension "brand"
            applicationId "com.tunlian.beibei"   // 新包名，与豚链AI共存
        }
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword "tunlian2026"
            keyAlias "tunlian"
            keyPassword "tunlian2026"
            /* 【2026-10-07】保留 v1 签名，老机型/部分 ROM 才能识别为同一应用，直接覆盖升级不用卸载 */
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    /* TRTC 的 so 体积大，按传统方式打包（不压缩）避免加载失败和解压占用 */
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        exclude 'META-INF/*.kotlin_module'
    }
}

/* 【2026-10-20】双口味的 APK 默认落在 app/build/outputs/apk/<口味>/release/ 下，
 * 原工作流（以及任何按老路径取包的脚本）读的是 app/build/outputs/apk/release/*.apk。
 * 这里在 assembleRelease 结束后把两个包拷回老目录并改名，避免为了改路径去动 .github/workflows（需要额外权限）。 */
tasks.register('copyFlavorApks') {
    doLast {
        def legacy = file("build/outputs/apk/release")
        legacy.mkdirs()
        fileTree("build/outputs/apk").include("*/release/*.apk").each { f ->
            def flavor = f.parentFile.parentFile.name
            copy {
                from f
                into legacy
                rename { "${flavor}.apk" }
            }
            println "已输出：build/outputs/apk/release/${flavor}.apk"
        }
    }
}
/* 注意：Android 的 assembleRelease 是 afterEvaluate 之后才注册的，这里必须等一等再挂，否则报 UnknownTaskException */
afterEvaluate {
    def assembleReleaseTask = tasks.findByName('assembleRelease')
    if (assembleReleaseTask != null) {
        assembleReleaseTask.finalizedBy tasks.named('copyFlavorApks')
    }
}

dependencies {
    /* 【2026-10-04】腾讯 TRTC 原生 SDK：会议不再跑在网页里，走手机硬件回声消除 */
    implementation 'com.tencent.liteav:LiteAVSDK_TRTC:12.9.0.19478'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.fragment:fragment:1.6.2'

    // 统一 Kotlin 标准库版本，避免 kotlin-stdlib 与 kotlin-stdlib-jdk7/8 类重复
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
